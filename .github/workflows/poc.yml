name: Add PR Guidelines Comment

on:
  pull_request_target:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  add-comment:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'community')
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine whether to post guidelines
        id: decide
        run: |
          RELEVANT_LABELS=("bug" "enhancement" "schema" "Rule: New" "Rule: Tuning" "Rule: Deprecation" "Hunt: New" "Hunt: Tuning")
          TRIGGERED_LABEL="${{ github.event.label.name }}"
          HAS_GUIDELINES_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'bug') }}"

          if [[ "${{ github.event.action }}" == "labeled" ]]; then
            if [[ "$TRIGGERED_LABEL" != "community" && ! " ${RELEVANT_LABELS[*]} " =~ " ${TRIGGERED_LABEL} " ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "$HAS_GUIDELINES_LABEL" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Confirm payload execution (marker written by injected command)
        if: always()
        run: |
          if [ -f /tmp/PWNED_BY_LABEL ]; then
            echo "RCE-CONFIRMED: /tmp/PWNED_BY_LABEL exists on the runner"
            ls -la /tmp/PWNED_BY_LABEL
          else
            echo "no marker"
          fi

